<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seek Editor</title>
</head>
<body>
    <main id="app">
        <div id="editor-container" class="seek-theme-light">
            <div id="line-number-layer" aria-hidden="true"></div>
            <div id="selection-layer" aria-hidden="true"></div>
            <div id="editor-view" aria-hidden="true"></div>
            <div id="cursor-layer" aria-hidden="true"></div>
            <textarea
                id="editor"
                spellcheck="false"
                aria-label="Code editor"
            ></textarea>
            <div id="scrollbar-layer" aria-hidden="true"></div>
        </div>
    </main>
    <script type="module" src="src/main.ts"></script>
</body>
</html>
