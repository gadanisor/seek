<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seek Editor</title>
</head>
<body>
    <main id="app">
        <header class="titlebar">
            <span>untitled.txt</span>
        </header>
        <div id="editor-container">
            <div id="line-number-layer" aria-hidden="true"></div>
            <div id="selection-layer" aria-hidden="true"></div>
            <div id="editor-view" aria-hidden="true"></div>
            <div id="cursor-layer" aria-hidden="true"></div>
            <textarea
                id="editor"
                spellcheck="false"
                aria-label="Code editor"
            ></textarea>
        </div>
        <footer class="statusbar">
            <span id="position">Ln 1, Col 1</span>
            <span>Plain Text</span>
        </footer>
    </main>
    <script type="module" src="src/main.ts"></script>
</body>
</html>
